[package]
name = "wi"
version = "0.2.0"
edition = "2024"
description = "Wi provider-pluggable subscription gateway with WebSocket/SSE sessions and typed events"
license = "MIT"
publish = false

[[bin]]
name = "wi"
path = "src/main.rs"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3.31", features = ["sink"] }
ring = "0.17.14"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std", "net", "signal", "time", "sync"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
# Stable event API rejects unsupported YAML before loading; UTF-8 is checked locally.
yaml-rust2 = { version = "=0.12.0", default-features = false }
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
