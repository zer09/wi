name: Nightly fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Optional exact fast-check seed (1..2147483647)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  extended-fuzz:
    name: extended fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Select reproducible fuzz seed
        id: fuzz-seed
        env:
          WI_MANUAL_FUZZ_SEED: ${{ inputs.seed }}
        run: node scripts/select-nightly-fuzz-seed.mjs

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run extended fuzz profile
        env:
          WI_FC_SEED: ${{ steps.fuzz-seed.outputs.seed }}
        run: pnpm test:fuzz:extended

      - name: Upload minimized counterexamples
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-counterexamples-${{ github.run_id }}
          path: .artifacts/fuzz/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
